spring:
  application:
    name: SmartLightingExp

  task:
    scheduling:
      pool:
        size: 4

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

  datasource:
    url: jdbc:mysql://rm-bp1vhdjtj6xp496p09o.mysql.rds.aliyuncs.com:3306/smart_lighting_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: app_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

mock:
  enabled: true

heartbeat:
  detection-interval-ms: 60000       # 离线检测定时任务周期（毫秒）
  offline-threshold-seconds: 360     # 超过此秒数无遥测上报判定离线
  startup-delay-ms: 120000           # 应用启动后延迟多久开始检测（毫秒）

manual:
  lock-duration-minutes: 30          # 手动控制后 AI 锁定时长（分钟）

mqtt:
  broker: ssl://47.96.27.141:8883
  username: backend
  password: 123456
  client-id: smart-lighting-backend-v888
  topic-prefix: streetlight

tdengine:
  url: jdbc:TAOS-RS://${TDENGINE_HOST:127.0.0.1}:6041/smart_lighting
  username: ${TDENGINE_USER:root}
  password: ${TDENGINE_PASSWORD:taosdata}

maxkb:
  chat-completions-url: ${MAXKB_CHAT_COMPLETIONS_URL:}
  api-key: ${MAXKB_API_KEY:}
  model: ${MAXKB_MODEL:gpt-3.5-turbo}

device:
  aes-key: ${DEVICE_AES_KEY}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.experiment.smartlightingexp.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
